[project]
name = "pinequest-ml"
version = "0.1.0"
description = "Dataset preparation, LoRA/QLoRA fine-tuning and evaluation for the PineQuest Mongolian AI patient"
requires-python = ">=3.10,<3.14"
dependencies = [
  "jsonschema>=4.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy dependencies for training / local inference. Install on a GPU machine:
#   uv sync --extra train            (CUDA, QLoRA via bitsandbytes on Linux)
train = [
  "torch>=2.4",
  "transformers>=4.51",
  "peft>=0.15",
  "trl>=0.19",
  "datasets>=3.0",
  "accelerate>=1.0",
  "bitsandbytes>=0.45; sys_platform == 'linux'",
]
dev = ["pytest>=8"]

[project.scripts]
pinequest-ml = "pinequest_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinequest_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
