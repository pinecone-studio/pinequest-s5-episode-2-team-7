# Recommended starting point: Qwen3-4B-Instruct-2507 (Apache-2.0, text-only).
# Hardware: one 16 GB NVIDIA GPU (free Kaggle T4/P100 or Colab T4) with QLoRA.
# 13 cases → ~5,300 train examples, median ~1,500 tokens: one epoch is ~330 steps,
# roughly 2.5-3 h on one T4. With only 9 training cases a second epoch mostly
# memorises their wording, so start with 1 and compare on the baseline sample.
base_model: Qwen/Qwen3-4B-Instruct-2507
adapter_id: pq-qwen3-4b-lora-v1          # must match FINETUNED_EXPECTED_ADAPTER in the app
output_dir: outputs/qwen3-4b-lora-v1
purpose: "Pipeline demonstration on synthetic, unreviewed cases — NOT for students."
quantization: 4bit                        # QLoRA (NF4); requires CUDA + bitsandbytes
max_seq_length: 2048
chat_template_kwargs: {}
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
training:
  epochs: 1
  batch_size: 2
  grad_accum: 8
  learning_rate: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.05
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  gradient_checkpointing: true
  seed: 42
